# Application stack: Web UI/API (server) + scheduled analysis (analyzer).
#
#   docker network create dsa-net                                    # 一次性
#   docker compose -f docker/docker-compose.db.yml up -d             # 数据库栈
#   python scripts/check_server_env.py
#   docker compose -f docker/docker-compose.server.yml up -d --build
#
# PostgreSQL 由 docker/docker-compose.db.yml 单独运行，通过外部网络 dsa-net
# 以别名 `db` 暴露给本栈（DATABASE_URL=...@db:5432/...）。
# 想改用宿主机数据库时，把 DATABASE_URL 换成 host.docker.internal 即可，
# 本栈无需改动（extra_hosts 已配置）。
#
# `server` 只对 127.0.0.1:${API_PORT} 提供 HTTP 给 Caddy；`analyzer` 用
# America/New_York 时区执行 `main.py --schedule`。跑这套时请关掉 GitHub
# Actions 的定时任务，否则同一批股票会被分析两次、浪费 LLM 配额。
name: daily-stock-analysis

services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: stock-server
    restart: unless-stopped
    env_file:
      - ../.env
    command: ["python", "main.py", "--serve-only", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      - TZ=Asia/Shanghai
      - WEBUI_HOST=0.0.0.0
      - WEBUI_ENABLED=true
    networks:
      - dsa-net
    # Also allows reaching a PostgreSQL running on the Docker host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Only Caddy (on the host) can reach this port; never expose 8000 publicly.
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      - ../reports:/app/reports
      - ../.env:/app/.env
      - ../strategies:/app/strategies:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # Scheduled analysis (daily) in America/New_York; command comes from the
  # Dockerfile CMD (`python main.py --schedule`).
  analyzer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: stock-analyzer
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # US market schedule: SCHEDULE_TIME is interpreted in this timezone.
      # Set SCHEDULE_TIME=10:00 in .env for 10:00 ET; DST handled by tzdata.
      - TZ=America/New_York
    networks:
      - dsa-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # analyzer 不提供 HTTP 服务，忽略镜像内置健康检查，避免被误标为 unhealthy
    healthcheck:
      disable: true
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      - ../reports:/app/reports
      - ../.env:/app/.env
      - ../strategies:/app/strategies:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

networks:
  dsa-net:
    external: true
